<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breakout</title>
  <link rel="icon" href="favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#000000">
  <style>
    /* Exo 2, served with the game (fonts/, SIL Open Font Licence) rather than from a font service, so the page
       makes no requests elsewhere. The canvas uses it too: main.js waits for it before the first frame */
    @font-face { font-family: 'Exo 2'; font-style: normal; font-weight: 400; font-display: swap;
                 src: url(fonts/exo2-400-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Exo 2'; font-style: normal; font-weight: 700; font-display: swap;
                 src: url(fonts/exo2-700-normal.woff2) format('woff2'); }
    @font-face { font-family: 'Exo 2'; font-style: italic; font-weight: 400; font-display: swap;
                 src: url(fonts/exo2-400-italic.woff2) format('woff2'); }
    @font-face { font-family: 'Exo 2'; font-style: italic; font-weight: 700; font-display: swap;
                 src: url(fonts/exo2-700-italic.woff2) format('woff2'); }
    html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%;
                 font-family: 'Exo 2', Arial, Helvetica, sans-serif; }
    /* The cursor is hidden from script only while a game is actually being played; see main.js updateCursor() */
    canvas { display: block; position: relative; z-index: 1; touch-action: none; -webkit-user-select: none;
             user-select: none; }

    /* Loading: part of the page, so it's up straight away, while the scripts and then the assets (some 50 MB)
       come in. main.js fills the bar a file at a time and hides it all once the game is ready to draw. It sits
       under the canvas, which stays see-through until the first frame paints it black from edge to edge, so
       the game covers it even if it's never hidden (a stale cached main.js from before it existed, say) */
    #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
               justify-content: center; gap: 2.5vh; color: #8aa8ff; font-size: 3.3vh; cursor: default; z-index: 0; }
    #loading[hidden] { display: none; }
    #loading .bar { width: min(60vw, 400px); height: 6px; border-radius: 3px; overflow: hidden;
                    background: rgba(128, 168, 255, 0.2); }
    #loading .fill { width: 0; height: 100%; background: #8aa8ff; transition: width 0.2s; }

    /* Help / Credits: an overlay that blurs the game behind it, with a scrolling panel in the middle */
    #modal { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
             background: rgba(0, 0, 0, 0.45); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
             cursor: default; z-index: 10; }
    #modal[hidden] { display: none; }
    #modal .panel { position: relative; box-sizing: border-box; width: min(92vw, 760px); max-height: 88vh;
                    overflow-y: auto; padding: 28px 36px 32px; border-radius: 14px;
                    background: rgba(12, 18, 36, 0.92); color: #dde6ff; border: 1px solid rgba(128, 168, 255, 0.35);
                    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6); font-size: 17px; line-height: 1.45; }
    #modal .close { position: absolute; top: 10px; right: 12px; width: 40px; height: 40px; border: 0; border-radius: 50%;
                    background: rgba(128, 168, 255, 0.15); color: #8aa8ff; font-size: 26px; line-height: 40px;
                    cursor: pointer; }
    #modal .close:hover { background: rgba(128, 168, 255, 0.35); color: #fff; }
    #modal h2 { margin: 0 0 12px; color: #8aa8ff; font-style: italic; font-size: 30px; }
    #modal h3 { margin: 22px 0 8px; color: #40e0e0; font-size: 20px; }
    #modal p { margin: 8px 0; }
    #modal a { color: #40e0e0; }
    #modal table { border-collapse: collapse; width: 100%; }
    #modal td { padding: 6px 10px 6px 0; vertical-align: top; }
    #modal .keys td:first-child { width: 90px; color: #40e0e0; font-weight: bold; white-space: nowrap; }
    #modal .bricks td:first-child { width: 56px; }
    #modal .bricks td:nth-child(2) { width: 150px; font-weight: bold; color: #fff; }
    #modal .bricks img { width: 44px; height: 44px; display: block; border-radius: 4px; }
    #modal ul { padding-left: 22px; }
    #modal li { margin: 6px 0; }
    #modal .dedication { margin-top: 22px; color: #8aa8ff; font-style: italic; }
    /* Options page (two-finger tap): big, finger-sized buttons stacked down the panel */
    #modal .options button { display: block; box-sizing: border-box; width: 100%; margin: 10px 0; padding: 14px 18px;
                             border-radius: 10px; border: 1px solid rgba(128, 168, 255, 0.35); font-size: 20px;
                             background: rgba(128, 168, 255, 0.15); color: #dde6ff; cursor: pointer; text-align: left; }
    #modal .options button:hover, #modal .options button:active { background: rgba(128, 168, 255, 0.35); color: #fff; }

    /* Selfie camera (the win certificate): a live preview filling the screen, mirrored like a mirror, with the
       buttons along the bottom and a status line along the top */
    #camera { position: fixed; inset: 0; background: #000; cursor: default; z-index: 20; }
    #camera[hidden] { display: none; }
    #camera video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
    #camera .camera-note { position: absolute; top: 24px; left: 0; right: 0; margin: 0; padding: 0 16px; text-align: center;
                           color: #dde6ff; font-size: 18px; text-shadow: 0 0 4px #000, 0 0 4px #000; }
    #camera .camera-bar { position: absolute; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom));
                          display: flex; justify-content: center; gap: 16px; }
    #camera button { padding: 14px 24px; border-radius: 10px; border: 1px solid rgba(128, 168, 255, 0.5); font-size: 20px;
                     background: rgba(12, 18, 36, 0.85); color: #dde6ff; cursor: pointer; }
    #camera button:hover, #camera button:active { background: rgba(128, 168, 255, 0.35); color: #fff; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="loading">
    <span>Loading…</span>
    <div class="bar"><div class="fill" id="loading-fill"></div></div>
  </div>
  <div id="modal" hidden>
    <div class="panel">
      <button class="close" type="button" aria-label="Close">&times;</button>
      <div id="modal-body"></div>
    </div>
  </div>
  <div id="camera" hidden>
    <video id="camera-video" autoplay playsinline muted></video>
    <p class="camera-note" id="camera-note"></p>
    <div class="camera-bar">
      <button type="button" data-camera="snap">Take the photo</button>
      <button type="button" data-camera="cancel">Cancel</button>
    </div>
  </div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
